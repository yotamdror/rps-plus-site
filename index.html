<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPS+</title>
<meta name="description" content="Rock, paper, scissors, plus. You already know the rules. Alpha coming, January 2027.">
<meta name="theme-color" content="#070708">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23070708'/%3E%3Crect x='1' y='5' width='4' height='6' fill='%23FF2E6E'/%3E%3Crect x='6' y='5' width='4' height='6' fill='%232EE6FF'/%3E%3Crect x='11' y='5' width='4' height='6' fill='%23FFCE3A'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/Jersey25-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Jersey 25"; src: url(fonts/Jersey25-400.woff2) format("woff2"); font-display: block; }
  @font-face { font-family: "Silkscreen"; src: url(fonts/Silkscreen-400.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Pixelify Sans"; src: url(fonts/PixelifySans-400_700.woff2) format("woff2"); font-weight: 400 700; font-display: swap; }

  :root {
    color-scheme: dark;
    /* master-palette tokens (rps-plus assets/palette.json) */
    --ink: #070708; --charcoal: #2B2824; --slate: #48433C; --warm-grey: #817965;
    --grey: #9E9687; --cream: #F3E5C4; --brass-light: #C0B48E;
  }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 0; box-sizing: border-box; position: relative; overflow-x: hidden;
    background: var(--ink);
  }

  /* the tiny sign-up */
  .notify { margin-top: 44px; min-height: 96px; display: flex; flex-direction: column; align-items: center; }
  .notify button.ask {
    all: unset; cursor: pointer;
    font-family: "Silkscreen", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--brass-light);
    padding: 14px 12px; /* a comfortable tap, small chrome */
  }
  .notify button.ask:focus-visible { outline: 1px solid var(--brass-light); outline-offset: 2px; }
  .notify form { display: none; flex-direction: column; align-items: center; gap: 10px; }
  .notify.open button.ask { display: none; }
  .notify.open form { display: flex; }
  /* the game's own field and button: a hairline ink box and a flat cream slab, no shading */
  .notify .row { display: flex; height: 44px; border: 1px solid var(--slate); background: var(--ink); }
  .notify .row:focus-within { outline: 2px solid var(--cream); outline-offset: 2px; }
  .notify input {
    width: min(58vw, 220px); box-sizing: border-box;
    padding: 0 10px; border: 0; border-radius: 0; outline: none;
    background: transparent; color: var(--cream);
    font: 16px "Pixelify Sans", system-ui, sans-serif;
  }
  .notify input::placeholder { color: var(--warm-grey); }
  .notify .send {
    border: 0; border-radius: 0; cursor: pointer; padding: 0 16px;
    font: 22px/1 "Jersey 25", ui-monospace, monospace; letter-spacing: 0.04em;
    color: var(--ink); background: var(--cream);
  }
  .notify .send:active { background: var(--brass-light); }
  .notify small {
    font: 13px "Pixelify Sans", system-ui, sans-serif; color: var(--warm-grey);
    max-width: 300px; text-align: center; line-height: 1.3;
  }
  .notify small.warn { color: var(--cream); }
  .notify small:empty { display: none; }
  .notify .send:disabled { opacity: 0.35; cursor: default; }
  /* sent: the field gives way to one brass word, the promise stays under it */
  .notify .noted {
    display: none; padding: 9px 0 10px;
    font-family: "Silkscreen", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.14em; color: var(--brass-light);
  }
  .notify.sent .row { display: none; }
  .notify.sent .noted { display: block; }

  /* the opener film (opener/, built in rps-plus by scripts/marketing/build-opener.mjs), cropped 76 px top and
     bottom (only sky and crowd there) to 393 x 700 and fitted to the screen on every device */
  #opener { width: min(100%, calc((100svh - 64px) * 393 / 700)); }
  #opener .box { aspect-ratio: 393 / 700 !important; }
  #opener .stage { top: calc(var(--s) * -76px) !important; }
  #opener .replay {
    background: transparent; border-color: var(--slate); border-radius: 0; color: var(--brass-light);
    font: 11px "Silkscreen", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase;
  }
  /* the sign-up sits on the film's lower edge in a dark box (moved into the film's .box after mount) */
  .below { display: flex; flex-direction: column; align-items: center; padding: 8px 16px 48px; }
  #opener .box .below { position: absolute; left: 0; right: 0; bottom: 6px; z-index: 5; padding: 0; pointer-events: none; }
  #opener .box .below > * { pointer-events: auto; }
  .below .chip {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 6px 0;
    background: rgba(7,7,8,.84); border: 1px solid var(--slate);
  }
  .below .notify { margin: 0; min-height: 0; }
  .below .notify button.ask { padding: 12px 12px; }
  .below .notify.open form { padding: 8px 2px 8px; }
  .below .notify input { width: min(44vw, 150px); }
  .below .notify small { max-width: 200px; }
</style>
</head>
<body>
  <div id="opener"></div>
  <div class="below"><div class="chip">
  <div class="notify" id="notify">
    <button class="ask" type="button" aria-expanded="false" aria-controls="notify-form">Send me updates ▸</button>
    <form id="notify-form" novalidate>
      <div class="row">
        <input type="email" name="email" placeholder="you@email" autocomplete="email" aria-label="Email" required>
        <button class="send" type="submit">SEND</button>
      </div>
      <p class="noted">NOTED ▸</p>
      <small role="status"></small>
    </form>
  </div>

  </div></div>
  <script>
    const box = document.getElementById('notify');
    box.querySelector('.ask').addEventListener('click', () => {
      box.classList.add('open');
      box.querySelector('input').focus();
    });
    // Sign-ups go to the RPS+ Alpha Worker's notify table (rps-plus repo, site-signup):
    // stored only there, read only by us, never shown back.
    const API = 'https://rps-plus-alpha-staging.rps-plus.workers.dev/api/notify';
    const form = box.querySelector('form'), input = form.querySelector('input');
    const send = form.querySelector('.send'), note = form.querySelector('small');
    const say = (text, warn) => { note.textContent = text; note.classList.toggle('warn', !!warn); };
    input.addEventListener('input', () => { if (note.classList.contains('warn')) say(''); });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (send.disabled) return;
      const email = input.value.trim();
      if (!/^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(email) || email.length > 254) {
        say("That doesn't look like an email.", true); input.focus(); return;
      }
      send.disabled = true;
      try {
        const res = await fetch(API, {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email, source: 'site' }), signal: AbortSignal.timeout(10000)
        });
        if (res.status === 400) { say("That doesn't look like an email.", true); input.focus(); return; }
        if (!res.ok) throw new Error(res.status);
        box.classList.add('sent'); say(''); input.value = '';
      } catch {
        say("Didn't go through. Try again.", true);
      } finally {
        send.disabled = false;
      }
    });
  </script>
  <script src="opener/opener-player.js"></script>
  <script>
    // ?autoplay=0 holds the film still (for screenshots)
    window.film = RPSOpener.mount(document.getElementById('opener'),
      { base: 'opener/', autoplay: !/[?&]autoplay=0/.test(location.search) });
    document.querySelector('#opener .box').appendChild(document.querySelector('.below'));
  </script>
</body>
</html>
