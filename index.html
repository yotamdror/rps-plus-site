<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPS+</title>
<meta name="description" content="Rock, paper, scissors, plus. You already know the rules. Alpha coming, end of year 2026.">
<meta name="theme-color" content="#000000">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #e8e4da; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 16px; box-sizing: border-box; text-align: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  h1 { margin: 0; font-size: clamp(56px, 18vw, 120px); letter-spacing: 0.04em; line-height: 1; }
  .r { color: #FF2E6E; } .p { color: #2EE6FF; } .s { color: #FFCE3A; }
  p { margin: 0; font-size: 17px; }
  .alpha { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; }
</style>
</head>
<body>
  <h1><span class="r">R</span><span class="p">P</span><span class="s">S</span>+</h1>
  <p>You already know the rules.</p>
  <p class="alpha">Alpha coming · end of year 2026</p>
</body>
</html>
