<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPS+</title>
<meta name="description" content="Rock, paper, scissors, plus. You already know the rules. Alpha coming, end of year 2026.">
<meta name="theme-color" content="#070708">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23070708'/%3E%3Crect x='1' y='5' width='4' height='6' fill='%23FF2E6E'/%3E%3Crect x='6' y='5' width='4' height='6' fill='%232EE6FF'/%3E%3Crect x='11' y='5' width='4' height='6' fill='%23FFCE3A'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/Jersey25-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Jersey 25"; src: url(fonts/Jersey25-400.woff2) format("woff2"); font-display: block; }
  @font-face { font-family: "Silkscreen"; src: url(fonts/Silkscreen-400.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Pixelify Sans"; src: url(fonts/PixelifySans-400_700.woff2) format("woff2"); font-weight: 400 700; font-display: swap; }

  :root {
    color-scheme: dark;
    /* master-palette tokens (rps-plus assets/palette.json) */
    --ink: #070708; --charcoal: #2B2824; --slate: #48433C; --warm-grey: #817965;
    --grey: #9E9687; --cream: #F3E5C4; --brass-light: #C0B48E;
    /* the three signals: the wordmark and nothing else */
    --rock: #FF2E6E; --paper: #2EE6FF; --scis: #FFCE3A;
  }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box; position: relative; overflow-x: hidden;
    background: radial-gradient(ellipse 80% 60% at 50% 45%, #141311 0%, var(--ink) 70%);
    background-color: var(--ink);
  }

  /* the game's sky: a few square stars, one twinkling a step on a slow clock */
  .sky i { position: absolute; width: 2px; height: 2px; background: var(--slate); }
  .sky i.t { animation: twinkle 6s steps(1, end) infinite; }
  .sky i.t:nth-child(5) { animation-duration: 7.5s; animation-delay: -3s; }
  @keyframes twinkle { 0%, 88% { background: var(--slate); } 89%, 96% { background: var(--grey); } }

  /* lit plastic letters: a bright top, a dark lower lip, a glow on the wall */
  h1 {
    margin: 0;
    font-family: "Jersey 25", ui-monospace, monospace; font-weight: 400;
    font-size: clamp(96px, 32vw, 168px); line-height: 0.9; letter-spacing: 0.02em;
  }
  h1 span { display: inline-block; position: relative; }
  h1 span::before {
    content: attr(data-l); position: absolute; inset: 0;
    background: linear-gradient(180deg, #ffffff59 0%, #ffffff00 40%, #00000000 72%, #00000033 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none;
  }
  .r { color: var(--rock);  text-shadow: 0 2px 0 #7a1636, 0 0 28px #FF2E6E66; }
  .p { color: var(--paper); text-shadow: 0 2px 0 #12707c, 0 0 28px #2EE6FF66; }
  .s { color: var(--scis);  text-shadow: 0 2px 0 #7f631a, 0 0 28px #FFCE3A66; }
  .plus { color: var(--cream); text-shadow: 0 2px 0 #6b6150, 0 0 22px #F3E5C433; }

  /* the lamps come on one by one, like ROCK, PAPER, SCISSORS in the film.
     steps() keeps every change on whole frames, well under 30 a second */
  h1 span { animation: lamp 0.6s steps(1, end) both; }
  .r { animation-delay: 0.3s; } .p { animation-delay: 0.7s; }
  .s { animation-delay: 1.1s; } .plus { animation-delay: 1.6s; }
  @keyframes lamp {
    0%   { opacity: 0.12; }
    20%  { opacity: 1; }
    35%  { opacity: 0.12; }
    50%, 100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 span, .sky i.t { animation: none; }
  }

  .line {
    margin: 28px 0 0;
    font-family: "Silkscreen", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--warm-grey); text-align: center;
  }
  .line span { white-space: nowrap; }

  /* the tiny sign-up */
  .notify { margin-top: 44px; min-height: 96px; display: flex; flex-direction: column; align-items: center; }
  .notify button.ask {
    all: unset; cursor: pointer;
    font-family: "Silkscreen", ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--brass-light);
    padding: 14px 12px; /* a comfortable tap, small chrome */
  }
  .notify button.ask:focus-visible { outline: 1px solid var(--brass-light); outline-offset: 2px; }
  .notify form { display: none; flex-direction: column; align-items: center; gap: 10px; }
  .notify.open button.ask { display: none; }
  .notify.open form { display: flex; }
  .notify .row { display: flex; }
  .notify input {
    width: min(58vw, 220px); box-sizing: border-box;
    padding: 10px 10px; border: 0; border-radius: 0;
    background: var(--charcoal); color: var(--cream);
    font: 16px "Pixelify Sans", system-ui, sans-serif;
    box-shadow: inset 0 2px 0 #00000080, inset 0 0 0 1px var(--slate);
  }
  .notify input::placeholder { color: var(--warm-grey); }
  .notify input:focus { outline: none; box-shadow: inset 0 2px 0 #00000080, inset 0 0 0 1px var(--brass-light); }
  .notify .send {
    border: 0; border-radius: 0; cursor: pointer; padding: 0 14px;
    font-family: "Silkscreen", ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em;
    color: var(--ink); background: linear-gradient(180deg, #D6CBA6 0%, var(--brass-light) 50%, #A89870 100%);
    box-shadow: inset 0 1px 0 #ffffff66, inset 0 -2px 0 #00000040;
  }
  .notify .send:active { box-shadow: inset 0 2px 0 #00000040; }
  .notify small {
    font: 13px "Pixelify Sans", system-ui, sans-serif; color: var(--warm-grey);
    max-width: 300px; text-align: center; line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <i style="left:11%;top:14%"></i><i class="t" style="left:83%;top:9%"></i>
    <i style="left:64%;top:27%"></i><i style="left:22%;top:79%"></i>
    <i class="t" style="left:89%;top:68%"></i><i style="left:6%;top:46%"></i>
    <i style="left:47%;top:92%"></i>
  </div>

  <h1 aria-label="RPS+"><span class="r" data-l="R">R</span><span class="p" data-l="P">P</span><span class="s" data-l="S">S</span><span class="plus" data-l="+">+</span></h1>
  <p class="line"><span>Alpha coming ·</span> <span>end of year 2026</span></p>

  <div class="notify" id="notify">
    <button class="ask" type="button" aria-expanded="false" aria-controls="notify-form">Tell me when ▸</button>
    <form id="notify-form" novalidate>
      <div class="row">
        <input type="email" name="email" placeholder="you@email" autocomplete="email" aria-label="Email" required>
        <button class="send" type="submit">SEND</button>
      </div>
      <small>One email when the alpha opens. Nothing else.</small>
    </form>
  </div>

  <script>
    const box = document.getElementById('notify');
    box.querySelector('.ask').addEventListener('click', () => {
      box.classList.add('open');
      box.querySelector('input').focus();
    });
    // MOCK: not wired. The real form posts to the alpha-notify endpoint once it exists.
    box.querySelector('form').addEventListener('submit', e => e.preventDefault());
  </script>
</body>
</html>
